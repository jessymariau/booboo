<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>🐾 Booboo Panel</title>
    <script>
      /* set the theme before first paint so surfaces never flash the wrong colour */
      try { var e_ = new URLSearchParams(location.search).get("embed"); document.documentElement.setAttribute("data-theme", (!e_ && localStorage.getItem("booboo-theme-v2") === "dark") ? "dark" : "light"); } catch (e) {}
    </script>
    <!-- the house type: loads when online (the hosted demo); the local CLI panel
         degrades gracefully to the system stacks in panel.css -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { margin: 0; height: 100%; background: var(--bg, #fcfbf9); }
      :root[data-theme="dark"] { --bg: #0b0509; } /* so the fallback resolves dark before panel.css loads */

      /* Shown from FIRST PAINT until React mounts and replaces #root.
         Panel.tsx already has a `waking the organigram…` state, but it cannot
         help here: it lives inside the component tree, so nothing renders it
         until the bundle has parsed AND /api/org has answered. On a cold
         /api/panelapi lambda that window was measured at over 11s, and what a
         first-time visitor saw for all of it was an empty coloured rectangle —
         the page reads as broken, not as loading. This needs no JS and no
         stylesheet, so it survives both. Same words as the React state so the
         handover between them is invisible. */
      #boot { min-height: 100vh; display: grid; place-items: center; padding: 30px; text-align: center; color: #6b6257;
              font: 400 14px/1.6 "DM Sans", ui-sans-serif, system-ui, -apple-system, sans-serif; }
      :root[data-theme="dark"] #boot { color: #a89f92; }
      #boot .paw { font-size: 26px; margin-bottom: 12px; animation: boot-breathe 1.9s ease-in-out infinite; }
      #boot small { display: block; margin-top: 7px; font-size: 12.5px; opacity: .62; }
      @keyframes boot-breathe { 0%, 100% { opacity: .32 } 50% { opacity: .95 } }
      @media (prefers-reduced-motion: reduce) { #boot .paw { animation: none; opacity: .7 } }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot"><div><div class="paw">🐾</div>waking the organigram…<small>reading the org file and the snapshot</small></div></div></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
